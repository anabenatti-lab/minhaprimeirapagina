<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site Interativo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e2e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      background: #2b2b3d;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 90%;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s, background 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .btn-agua { background-color: #3584e4; color: white; }
    .btn-quimica { background-color: #e5a50a; color: white; }

    #info-box {
      background: #181825;
      padding: 20px;
      border-radius: 8px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Explorar Tópicos</h1>
    
    <div class="btn-group">
      <button class="btn-agua" onclick="mostrarTexto('agua')">Água</button>
      <button class="btn-quimica" onclick="mostrarTexto('quimica')">Química</button>
    </div>

    <div id="info-box">
      <p id="texto">Clique em um dos botões acima para ver as informações.</p>
    </div>
  </div>

  <script>
    function mostrarTexto(topico) {
      const campoTexto = document.getElementById('texto');
      
      if (topico === 'agua') {
        campoTexto.innerHTML = "<strong>Água (H₂O):</strong> Essencial para a vida. Cobre cerca de 71% da superfície da Terra e é composta por dois átomos de hidrogênio e um de oxigênio.";
      } else if (topico === 'quimica') {
        campoTexto.innerHTML = "<strong>Química:</strong> É a ciência que estuda a matéria, suas propriedades, como e por que as substâncias se combinam ou se separam para formar outras.";
      }
    }
  </script>

</body>
</html>
